<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clientes — VendeFácil</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/clientes.css">

</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                VendeFácil
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html">
                    📊 Dashboard
                </a>

                <a
                    href="clientes.html"
                    class="active"
                >
                    👥 Clientes
                </a>

                <a href="produtos.html">
                    📦 Produtos
                </a>

                <a href="pedidos.html">
                    🛒 Pedidos
                </a>

                <a
                    href="#"
                    onclick="logout()"
                >
                    🚪 Sair
                </a>

            </nav>

        </aside>


        <main class="main-content">

            <div class="page-header">

                <div>

                    <h1>
                        Clientes
                    </h1>

                    <p>
                        Gerencie seus clientes
                    </p>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="document.getElementById('nome').focus()"
                >
                    + Novo cliente
                </button>

            </div>


            <div class="clientes-card">

                <h3>
                    Cadastrar cliente
                </h3>

                <form
                    id="clienteForm"
                    onsubmit="criarCliente(event)"
                    style="
                        margin-top:20px;
                        display:grid;
                        grid-template-columns:
                        repeat(2, 1fr);
                        gap:15px;
                    "
                >

                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                        >

                    </div>


                    <div class="form-group">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                        >

                    </div>


                    <div class="form-group">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                        >

                    </div>


                    <div class="form-group">

                        <label for="observacoes">
                            Observações
                        </label>

                        <input
                            type="text"
                            id="observacoes"
                        >

                    </div>


                    <div style="grid-column:1 / -1">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Cadastrar cliente
                        </button>

                    </div>

                </form>

            </div>


            <br>


            <div class="clientes-card">

                <h3>
                    Clientes cadastrados
                </h3>

                <div
                    class="table-container"
                    style="margin-top:20px"
                >

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>E-mail</th>
                                <th>Status</th>
                                <th>Ações</th>

                            </tr>

                        </thead>

                        <tbody
                            id="clientesTableBody"
                        >

                            <tr>

                                <td colspan="6">
                                    Carregando...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script src="js/api.js"></script>
    <script src="js/clientes.js"></script>

</body>

</html>
