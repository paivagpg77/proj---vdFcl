<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos — VendeFácil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/produtos.css">
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">VendeFácil</div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="clientes.html">👥 Clientes</a>
                <a href="produtos.html" class="active">📦 Produtos</a>
                <a href="pedidos.html">🛒 Pedidos</a>
                <a href="#" onclick="logout()">🚪 Sair</a>
            </nav>
        </aside>

        <main class="main-content">

            <div class="produtos-header">
                <div>
                    <h1>Produtos</h1>
                    <p>Gerencie seus produtos e estoque</p>
                </div>
            </div>

            <div class="produtos-card">

                <h3>Cadastrar produto</h3>

                <form
                    id="produtoForm"
                    onsubmit="criarProduto(event)"
                    style="
                        margin-top: 20px;
                        display: grid;
                        grid-template-columns: repeat(2, 1fr);
                        gap: 15px;
                    "
                >
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria">
                    </div>

                    <div class="form-group">
                        <label for="preco">Preço</label>
                        <input
                            type="number"
                            id="preco"
                            step="0.01"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="estoque">Estoque</label>
                        <input type="number" id="estoque" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="estoque_minimo">Estoque mínimo</label>
                        <input
                            type="number"
                            id="estoque_minimo"
                            min="0"
                            value="5"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao">
                    </div>

                    <div style="grid-column: 1 / -1">
                        <button type="submit" class="btn btn-primary">
                            Cadastrar produto
                        </button>
                    </div>
                </form>

            </div>

            <br>

            <div class="produtos-card">

                <h3>Produtos cadastrados</h3>

                <div class="table-container" style="margin-top: 20px">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="produtosTableBody">
                            <tr>
                                <td colspan="7">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/produtos.js"></script>

</body>

</html>
